# Training and evaluation configuration for YOLO11 fine-tuning on synth_pages
# Designed for fair empirical comparison against CRNN on identical synthetic text.

model:
  # Base pretrained YOLO11 model from Ultralytics
  # Options: yolo11n.pt (fastest), yolo11s.pt, yolo11m.pt, yolo11l.pt, yolo11x.pt
  name: "yolo11n.pt"
  task: "detect"
  # Target detection unit: 73 non-space characters from synth_pages
  type: "character_detector"

paths:
  # Path to the shared synthetic dataset generated by synth_pages
  data_dir: "../synth_pages/output/yolo"
  data_yaml: "./data.yaml"
  metadata_file: "../synth_pages/output/metadata.jsonl"
  
  # Output directories for trained weights, evaluation reports, and run logs
  project: "./runs"
  name: "yolo11_crnn_benchmark"
  checkpoints_dir: "./checkpoints"
  reports_dir: "./reports"
  logs_dir: "./logs"

dataset:
  # Character detection: 73 classes (space is reconstructed from spatial gaps)
  num_classes: 73
  # Use imgsz=1024 (native synth_pages canvas width); downscaling destroys tiny punctuation
  imgsz: 1024
  # Dataset splits defined in synth_pages
  splits:
    train: "images/train"
    val: "images/val"
    test_seen: "images/test_seen_moderate"
    test_unseen_fonts: "images/test_unseen_fonts_moderate"
    test_tiers:
      clean: "images/test_tiers_clean"
      moderate: "images/test_tiers_moderate"
      hard: "images/test_tiers_hard"

training:
  epochs: 50
  batch_size: 16
  imgsz: 1024
  device: ""              # Auto-detect GPU if available, else CPU (or specify "0", "cpu")
  workers: 4
  optimizer: "auto"       # 'auto', 'AdamW', 'SGD'
  lr0: 0.01               # Initial learning rate
  lrf: 0.01               # Final learning rate factor (lr0 * lrf)
  patience: 15            # Early stopping patience in epochs
  save: true
  save_period: -1         # Save checkpoint every x epochs (-1 for best & last only)
  plots: true             # Generate training curves and confusion matrix
  val: true               # Run validation at each epoch
  
  # CRITICAL AUGMENTATION CONSTRAINTS FOR DOCUMENT OCR (synth_pages Pitfall 4):
  # Flips MUST be disabled because mirroring destroys character glyph identity (e.g., b vs d, p vs q)
  fliplr: 0.0
  flipud: 0.0
  degrees: 0.0            # Geometric skew is already applied synthetically by synth_pages
  mosaic: 0.0             # Mosaic disrupts natural paragraph layout and reading order
  mixup: 0.0              # Mixup blends overlapping characters, distorting OCR glyphs
  scale: 0.2              # Mild scale jitter
  translate: 0.1          # Mild translation

# Character set definition matching synth_pages Section 4.1 exactly
charset:
  lowercase: "abcdefghijklmnopqrstuvwxyz" # IDs 0 to 25
  uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ" # IDs 26 to 51
  digits: "0123456789"                    # IDs 52 to 61
  punctuation: [".", ",", ";", ":", "!", "?", "'", "\"", "-", "(", ")"] # IDs 62 to 72

# Canonical look-alike character groups from synth_pages Section 5 & 9
# Used for Normalized CER to evaluate visual ambiguity fairly
lookalike_groups:
  - ["I", "l", "1"]
  - ["O", "0", "o"]
  - ["c", "C"]
  - ["s", "S"]
  - ["v", "V"]
  - ["w", "W"]
  - ["x", "X"]
  - ["z", "Z"]

# Text line reconstruction (reading order + space gap detection)
transcription:
  conf_threshold: 0.25    # Confidence threshold to accept detected character
  iou_threshold: 0.45     # NMS IOU threshold
  line_grouping_tol: 0.6  # Vertical overlap tolerance for grouping boxes into lines
  space_gap_ratio: 0.35   # Gap width threshold relative to character width to insert space
